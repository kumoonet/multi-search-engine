    notes: "欧央行汇率 + 时间序列（{q}=目标币种如 CNY；历史区间 /2020-01-01..2026-01-01?from=USD&to=CNY）；实测 2.9s（2026-09-05）"

  - id: currency_api
    name: Currency-api（fawazahmed0）
    group: endpoint
    url: "https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/{q}.min.json"
    probe: "https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.min.json"
    ok_marker: "usd"
    status_proxy: untested
    status_cn_direct: ok
    fallback: baidu
    intents: [fact]
    langs: [any]
    notes: "150+ 币种汇率无限制，CDN 分发（{q}=币种代码如 usd/cny）；frankfurter 降级互补；实测 0.8s（2026-09-05）"

  # ---------- 学术集群（零 Key API） ----------
  - id: openalex
    name: OpenAlex
    group: academic
    url: "https://api.openalex.org/works?search={q}"
    probe: "https://api.openalex.org/works?search=machine+learning&per-page=1"
    ok_marker: "\"results\""
    status_proxy: ok
    status_cn_direct: ok
    fallback: crossref
    intents: [academic, restricted_fallback]
    langs: [any]
    notes: "2.5 亿文献 CC0；直连可达（count 百万级正常返回），直连环境学术 API 首选"

  - id: crossref
    name: Crossref
    group: academic
    url: "https://api.crossref.org/works?query={q}"
    probe: "https://api.crossref.org/works?query=machine+learning&rows=1"
    ok_marker: "\"message\""
    status_proxy: ok
    status_cn_direct: ok
    fallback: openalex
    intents: [academic]
    langs: [any]
    notes: "1.5 亿 DOI backbone；加 &mailto= 提权限流额度"

  - id: semantic_scholar
    name: Semantic Scholar
    group: academic
    url: "https://api.semanticscholar.org/graph/v1/paper/search?query={q}"
    probe: "https://api.semanticscholar.org/graph/v1/paper/search?query=machine+learning&limit=1"
    ok_marker: "\"data\""
    bad_marker: "Too Many Requests"
    status_proxy: blocked
    status_cn_direct: shell
    fallback: openalex
    intents: [academic]
    langs: [en]
    notes: "匿名限流严重（Too Many Requests），配可选 Key 提额"

  - id: pubmed
    name: PubMed E-utilities
    group: academic
    url: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi?db=pubmed&term={q}&retmode=json"
    probe: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi?db=pubmed&term=cancer&retmode=json&retmax=1"
    ok_marker: "esearchresult"
    status_proxy: ok
    status_cn_direct: ok
    fallback: openalex
    intents: [academic]
    langs: [en]
    notes: "3,600 万医学文献金标准"

  - id: arxiv
    name: arXiv API
    group: academic
    url: "https://export.arxiv.org/api/query?search_query=all:{q}&max_results=10"
    probe: "https://export.arxiv.org/api/query?search_query=all:transformer&max_results=1"
    ok_marker: "<entry>"
    status_proxy: ok
    status_cn_direct: timeout
    fallback: openalex
    intents: [academic]
    langs: [en]
    notes: "240 万预印本，返回标准 Atom；必须用 export.arxiv.org 域名"

  - id: biorxiv
    name: bioRxiv API
    group: academic
    url: "https://api.biorxiv.org/details/biorxiv/{q}"
    probe: "https://api.biorxiv.org/details/biorxiv/10.1101/2024.01.01.573820"
    ok_marker: "collection"
    status_proxy: ok
    status_cn_direct: ok
    fallback: pubmed
    intents: [academic]
    langs: [en]
    notes: "{q} 为 DOI，真实格式 10.1101/YYYY.MM.DD.xxxxx，格式错报 non-numeric value"

  # ---------- 社区信号源 ----------
  - id: hackernews
