  # ---------- 语义搜索通道（1，MCP 非 web_fetch，v2.9.0 新增） ----------
  - id: exa
    name: Exa（神经语义搜索）
    group: semantic
    url: "https://mcp.exa.ai/mcp"   # MCP 端点，非 web_fetch 模板；经 web_search_exa / web_fetch_exa（免费层）/ web_search_advanced_exa（需 Key）工具调用
    probe: "https://mcp.exa.ai/mcp"
    ok_marker: ""
    bad_marker: ""
    manual: true
    status_proxy: untested
    status_cn_direct: ok
    fallback: null
    intents: [default_zh, default_en, tech, academic, fact]
    langs: [any]
    notes: "神经语义搜索（按意义匹配非关键词，描述性查询）。定位：① 层 0 侦查语义探路（用户原话直投，结果标题/摘要暴露行话）；② ⑤.8 语义雪球（URL 作 query 找内容同构但无引用关系的页面）；③ ⑤.5 描述性查询重构（关键词搜不到时改写为语义描述）；④ **JS 重页面盲区补丁**——web_fetch_exa 服务端渲染抓取，实测掘金 SPA 首页 3029 字符真数据（2026-09-05），SearXNG 自建由此降为可选。调用方式：MCP 工具（**非 web_fetch——不参与层 3 常规执行与渠道数计数**）。**2026-08-29 免费层实测**：大陆直连可达（~2s），initialize 握手 exa-search-server v3.2.1（tools/prompts/resources 齐全）；免费层无 Key 仅暴露 **web_search_exa**（语义搜索，参数 query/numResults/type/livecrawl/contextMaxCharacters，返回标题/URL/发布日/Highlights）+ **web_fetch_exa**（URL 抓取，参数 urls 数组）两工具且实测可调；**web_search_advanced_exa（域过滤/时间/category/contents.summary+JSON schema 结构化提取）与 deep_search 需 API Key 解锁**——语义雪球免费层用 web_search_exa 的 query 传 URL 近似替代，结构化提取需 Key 后启用。⚠️ python-urllib 默认 UA 被 Cloudflare 403，裸脚本调 MCP 端点须带浏览器 UA。MCP 端点 GET 探活无意义，selftest 不探活不写回，状态人工实测维护"

  # ---------- 浏览器自动化通道（1，CLI 非 web_fetch，v3.0.0 新增） ----------
  - id: browser_act
    name: BrowserAct（浏览器自动化兜底）
    group: browser
    executor: browser_act
    url: "browser-act stealth-extract <url> --content-type html"   # CLI 命令模板，非 URL；完整能力见手册 ⑤.10（open/state/interact/network requests/eval/screenshot/solve-captcha）
    probe: ""        # CLI 通道无探活 URL；自检用 `browser-act --version` + `browser-act get-skills core`
    ok_marker: ""
    bad_marker: ""
    manual: true
    status_proxy: untested
    status_cn_direct: ok
    fallback: null
    intents: [default_zh, default_en, tech, academic, news, wechat, community, fact]   # 通用兜底，不进常规路由组
    langs: [any]
    notes: "**第二执行范式（v3.0.0 新增，2026-09-19 实测打通）**：本地 CLI + 云浏览器，补 web_fetch 三大死区——① JS 渲染页（web_fetch 丢 img/DOM，实测雁荡山官网 wzyds.com 与温州政务 CMS 的 img src 全量抓到，WebFetch 均拿不到）；② 登录态（cookie 保持，多浏览器账号隔离）；③ 验证码（solve-captcha 自动解 + remote-assist 人工接管兜底）。**定位：层 3 降级链第四级兜底（重试→回声→浏览器兜底→fallback），非常规路径**——云服务有免费配额、单次 10-30s 延迟，web_fetch 通的情况下禁止动用；quick 档禁用。⚠️ 三重前置（缺一即 230331/安装失败）：① WorkBuddy 用户需开启 Allow Full Access；② Python ==3.12.*（embed zip 解压方案，3.13 pip 拒装、官方静默安装器 exit 67 不可靠，见手册 F.4.2）；③ `browser-act auth login`→用户注册→`auth poll` 拿 Key。使用纪律：单任务浏览器调用 ≤3 次、用后必 `session close`、登录态涉隐私需用户显式授权。MCP/CLI 端点 GET 探活无意义，selftest 不探活不写回，状态人工实测维护（2026-09-19 雁荡山官网+温州政务 CMS 双站点实测 ok）"

# ---------- 路由组定义（手册 ② 按组名引用，selftest 不探测本节） ----------
route_groups:
  tech: [google_hk, ddg, bing_intl, github_search]
  academic: [bing_academic, openalex, crossref, arxiv, pubmed, google_scholar]
  wechat: [weixin, baidu, so360]
  news: [google_news_rss, google_hk, baidu]
  default_zh: [baidu, bing_cn, bing_intl, so360, sogou, weixin, sm]
  default_en: [bing_intl, ecosia, ddg, brave, startpage, yahoo, google_hk]
  community: [polymarket, hackernews, github_search, reddit]
  # 大陆直连兜底组：2026-08-13 实测全部直连可用（ecosia 已 301 重定向，剔除出兜底组；yandex/naver/mojeek/yahoo_jp/marginalia/seznam 2026-08-15 直连实测补充出口）
  restricted_fallback_zh: [baidu, bing_cn, bing_intl, so360, sogou, weixin, sm]
  restricted_fallback_en: [bing_intl, yandex, naver, mojeek, yahoo_jp, marginalia, seznam, openalex, google_news_rss, github_search, bing_academic]
  # 语义搜索通道（v2.9.0）：非层 3 web_fetch 执行组（MCP 工具调用），仅层 0 侦查语义探路 / ⑤.8 语义雪球 / ⑤.5 描述性查询重构使用，不计入层 3 渠道数与 ④ 调用分级
  semantic: [exa]

# 调用分级（手册 ④ 的机器可读版；engines 统一为字符串，deep 允许范围表述）
tiers:
  quick: { engines: "3", note: "baidu + bing_intl + ddg；ddg 不可达 → so360（禁止降双引擎，双引擎凑不齐交叉验证最低人数）" }
  standard: { engines: "6-8", note: "按意图与语言路由" }
  deep: { engines: "12-16 或当前出口可达上限", note: "全量+学术/垂直；凑不满 12 按可达上限执行并注明" }
