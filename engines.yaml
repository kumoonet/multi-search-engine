    status_proxy: ok
    status_cn_direct: timeout
    fallback: ddg
    intents: [default_en]
    langs: [en, zh, es]
    notes: "独立索引；tf=pw/pm/py 时间过滤；source=news 已收费勿用"

  - id: ecosia
    name: Ecosia
    group: intl
    url: "https://www.ecosia.org/search?q={q}"
    probe: "https://www.ecosia.org/search?q=python"
    ok_marker: "result"
    status_proxy: ok
    status_cn_direct: shell
    fallback: bing_intl
    intents: [default_en]
    langs: [en, de, fr]
    notes: "Bing 系索引；⚠️ 直连已 301 重定向到必应主页拿不到结果（2026-08-13 午间复测，早间尚可用，状态漂移快）；直连英文改用 bing_intl"

  - id: qwant
    name: Qwant
    group: intl
    url: "https://www.qwant.com/?q={q}"
    probe: "https://www.qwant.com/?q=python"
    ok_marker: "result"
    status_proxy: geo
    status_cn_direct: timeout
    fallback: ddg
    intents: []
    langs: [fr, en, de]
    notes: "中国大陆 geo-block，需 EU 出口才可用；默认剔除出路由"

  - id: wolfram
    name: WolframAlpha
    group: intl
    url: "https://www.wolframalpha.com/input?i={q}"
    probe: "https://www.wolframalpha.com/input?i=100+USD+to+CNY"
    ok_marker: ""
    status_proxy: js_render
    status_cn_direct: untested
    fallback: null
    intents: [fact]
    langs: [en, zh, ja]
    notes: "知识计算（数学/单位/货币/股票）；web_fetch 抓不到结果，走官方 API 或 web_url_read"

  - id: yandex
    name: Yandex（俄系 SERP）
    group: intl
    url: "https://yandex.com/search/?text={q}"
    probe: "https://yandex.com/search/?text=python"
    ok_marker: "found"
    bad_marker: "captcha"
    status_proxy: ok
    status_cn_direct: shell
    fallback: bing_intl
    intents: [default_en, restricted_fallback]
    langs: [zh, en, ru]
    notes: "俄系 SERP，中文索引可用（2026-08-15/16 多次实测直连通过）；直连相对稳定，>30次/分限流 + 部分中国 IP 段可能触发动态拦截；中文回声搜索可用（对国内内容平台索引有覆盖）；作 restricted_fallback_en 补充出口 + 回声搜索渠道"

  - id: naver
    name: Naver（韩系第一）
    group: intl
    url: "https://search.naver.com/search.naver?query={q}"
