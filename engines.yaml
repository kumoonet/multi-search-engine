    ok_marker: "search_result"
    bad_marker: "captcha"
    status_proxy: ok
    status_cn_direct: shell
    fallback: bing_intl
    intents: [default_en, restricted_fallback]
    langs: [ko, en]
    notes: "韩系市场第一 SERP（2026-08-15 直连实测通过：英文检索真实结果无验证码）；UI 韩语、结果以韩语+英语混合，韩系/东亚内容独家；中文检索以韩语内容为主，价值在英文+韩系深度内容；直连稳定度待本机 selftest"

  - id: mojeek
    name: Mojeek（英国独立索引）
    group: intl
    url: "https://www.mojeek.com/search?q={q}"
    probe: "https://www.mojeek.com/search?q=python+tutorial"
    ok_marker: "results"
    bad_marker: "No pages found"
    status_proxy: ok
    status_cn_direct: blocked
    fallback: bing_intl
    intents: [default_en, restricted_fallback]
    langs: [en]
    notes: "英国独立爬虫索引（2026-08-15 直连实测通过：英文检索质量高，docs.python/GfG/TutorialsPoint）；**中文查询明确拒绝**（'doesn't currently search pages in this language'，bad_marker 可识别），不会静默给空结果——英文专用渠道；无反爬对 Agent 友好"

  - id: yahoo_jp
    name: Yahoo Japan（日系）
    group: intl
    url: "https://search.yahoo.co.jp/search?p={q}"
    probe: "https://search.yahoo.co.jp/search?p=python+tutorial"
    ok_marker: "search-result"
    bad_marker: "captcha"
    status_proxy: ok
    status_cn_direct: timeout
    fallback: bing_intl
    intents: [default_en, restricted_fallback]
    langs: [ja, en]
    notes: "日系市场 SERP（2026-08-15 直连实测通过：英文检索真实结果无验证码，英语为主+日语界面）；日系/东亚内容补充；直连稳定度待本机 selftest"

  - id: marginalia
    name: Marginalia（反主流独立索引）
    group: intl
    url: "https://search.marginalia.nu/search?query={q}"
    probe: "https://search.marginalia.nu/search?query=python+tutorial"
    ok_marker: "results"
    bad_marker: "captcha"
    status_proxy: ok
    status_cn_direct: ok
    fallback: bing_intl
    intents: [default_en, restricted_fallback]
    langs: [en]
    notes: "反主流独立索引（2026-08-15 直连实测通过：无验证码，纯独立/小众/复古站点，无商业推广）；专搜被 Google/Bing 忽略的独立小站/技术深内容，与 37 渠道零重叠；英文专用；直连稳定度待本机 selftest"

  - id: seznam
    name: Seznam（捷克独立索引）
    group: intl
    url: "https://search.seznam.cz/?q={q}"
    probe: "https://search.seznam.cz/?q=python+tutorial"
