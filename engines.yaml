# engines.yaml — 多元搜索渠道注册表（机器可读单一事实源）
# ============================================================
# 三件套之二。配套文件：
#   方法论手册: Multi-Search-Engine_v3.1.0.md（唯一入口，Agent 只需读它）
#   状态刷新器: selftest.py（双击 selftest.bat 运行，探活后把 status_cn_direct 写回本文件）
#
# 字段说明：
#   id              引擎唯一标识（手册 ② 路由表按 id 引用）
#   group           cn=国内 / intl=国际 / academic=学术 / endpoint=特化端点 / community=社区信号 / semantic=神经语义搜索（MCP 通道） / browser=浏览器自动化（CLI 通道）
#   executor        执行器（v3.0.0 新增）: web_fetch（默认，可省略）| browser_act（经 browser-act CLI，JS渲染/登录态/验证码/交互页专用，见 browser_act 条目）
#   url             查询 URL 模板，{q} 为查询词占位
#   probe           探活 URL（selftest.py 用，固定查询词）
#   ok_marker       响应体包含此子串 = 真实出结果（区分 JS 壳页/反爬页，HTTP 200 不可信）
#   bad_marker      响应体包含此子串 = 壳页/反爬（优先级高于 ok_marker）
#   status_proxy    能出墙出口实测状态（人工维护，selftest 不覆盖）
#   status_cn_direct 大陆直连实测状态（selftest.py 自动写回，手改会被覆盖）
#   状态值: ok=真实出结果 | shell=通但0结果(JS壳) | blocked=反爬/403 | timeout=超时 | geo=地域封锁 | js_render=需JS渲染 | untested
#   manual          true = selftest 只探测报告、不写回状态（此类引擎对 urllib 裸客户端返反爬页，
#                   但 web_fetch/curl 完整请求头可用，以人工/Agent 实测为准，防探活误伤）
#   fallback        降级目标引擎 id（❌/⚠️ 时必走）
#   intents         适用意图: default_zh/default_en/tech/academic/news/wechat/community/fact/restricted_fallback
#   langs          渠道支持的查询语言 TOP3（按优先级排序，实测优先；支持就用原文，不支持才翻译，见手册 ⑤.5 跨语言适配）：
#                   zh 中文 / en 英文 / ko 韩语 / ja 日语 / ru 俄语 / de 德语 / fr 法语 / es 西语 / any 任意语言原词直投
#   notes           人读备注（限流特征/解析提示/坑）
# ============================================================

meta:
  version: "3.1.0"
  last_probe: "2026-09-05"
  probe_egress: "大陆直连（选择性过滤出口）"

engines:
  # ---------- 国内引擎（7） ----------
  - id: baidu
    name: 百度
    group: cn
    url: "https://www.baidu.com/s?wd={q}"
    probe: "https://www.baidu.com/s?wd=python"
    ok_marker: "result"
    bad_marker: "安全验证"
    manual: true
    status_proxy: ok
    status_cn_direct: ok
    fallback: sogou
    intents: [default_zh, news, fact]
    langs: [zh, en]
    notes: "中文索引最全；高频/连续请求触发「百度安全验证」反爬页，间隔>2s 恢复；selftest 若标 shell 多为探活误伤，浏览器确认后可手动改回"

  - id: bing_cn
    name: 必应中国
    group: cn
    url: "https://cn.bing.com/search?q={q}&ensearch=0"
    probe: "https://cn.bing.com/search?q=python&ensearch=0"
    ok_marker: "b_algo"
    status_proxy: ok
    status_cn_direct: ok
    fallback: baidu
    intents: [default_zh, fact]
    langs: [zh, en]
    notes: "结果块 class=b_algo，可数条数判真实性"

  - id: bing_intl
    name: 必应国际
    group: cn
    url: "https://cn.bing.com/search?q={q}&ensearch=1"
    probe: "https://cn.bing.com/search?q=python&ensearch=1"
    ok_marker: "b_algo"
    status_proxy: ok
    status_cn_direct: ok
    fallback: ecosia
    intents: [default_en, tech, restricted_fallback]
    langs: [en, zh]
    notes: "中国服务器出英文结果；直连环境英文首选主力"

  - id: so360
    name: 360 搜索
    group: cn
    url: "https://www.so.com/s?q={q}"
    probe: "https://www.so.com/s?q=python"
    ok_marker: "res-list"
    status_proxy: ok
    status_cn_direct: ok
    fallback: baidu
    intents: [default_zh]
    langs: [zh, en]
    notes: ""

  - id: sogou
    name: 搜狗
    group: cn
    url: "https://sogou.com/web?query={q}"
    probe: "https://sogou.com/web?query=python"
    ok_marker: "results"
    status_proxy: ok
    status_cn_direct: shell
    fallback: baidu
    intents: [default_zh]
    langs: [zh, en]
    notes: "知乎内容优化好；知乎定向 site:zhihu.com 走此引擎"

  - id: weixin
    name: 微信搜索（搜狗）
    group: cn
    url: "https://wx.sogou.com/weixin?type=2&query={q}"
    probe: "https://wx.sogou.com/weixin?type=2&query=python"
    ok_marker: "news-list"
    status_proxy: ok
    status_cn_direct: ok
    fallback: null
    intents: [wechat]
    langs: [zh]
    notes: "唯一公众号搜索渠道，无降级；type=2 搜文章 / type=1 搜认证号（索引有限）；weixinmoni 端点是死链勿用。【配套 CLI 工具（v3.1.0 收编）】tools/wx_adapter（tanzi 适配器，MIT，上游 wx-search-cli 0.1.0）：首用 `npm ci --ignore-scripts`，`node cli.mjs search \"主题\" --limit N` 出标题/账号/日期/real_url+coverage，`node cli.mjs read <real_url>` 取全文；2026-10-07 实测搜索+解析+正文全链路通（11 项离线回归全过），命中偏 2018-2022 存量——适合挖存量深度长文，不适合当日舆情；安全面：只出搜狗/微信双域、cookie 仅内存、剥离凭证参数、风控即停"

  - id: sm
    name: 神马搜索
    group: cn
    url: "https://m.sm.cn/s?q={q}"
    probe: "https://m.sm.cn/s?q=python"
    ok_marker: "result"
    status_proxy: ok
    status_cn_direct: ok
    fallback: baidu
    intents: [default_zh]
    langs: [zh, en]
    notes: "移动端优化"

  # ---------- 国际引擎（15） ----------
  - id: google
    name: Google 主站
    group: intl
    url: "https://www.google.com/search?q={q}"
    probe: "https://www.google.com/search?q=python"
    ok_marker: "id=\"search\""
    bad_marker: "Please click here if you are not redirected"
    status_proxy: shell
    status_cn_direct: timeout
    fallback: bing_intl
    intents: [default_en, tech]
    langs: [en, zh, ja]
    notes: "裸 fetch 返 JS 重定向壳/consent 墙，HTTP 200 但 0 结果；需 cookie/JS 处理，零配置勿作首选"

  - id: google_hk
    name: Google 香港
    group: intl
    url: "https://www.google.com.hk/search?q={q}"
    probe: "https://www.google.com.hk/search?q=python"
    ok_marker: "id=\"search\""
    bad_marker: "Please click here if you are not redirected"
    status_proxy: shell
    status_cn_direct: timeout
    fallback: bing_intl
    intents: [default_en]
    langs: [zh, en]
    notes: "同 google，裸 fetch 返壳页（2026-08-13 实测）；时间过滤 tbs=qdr:w 等参数见手册 ⑤"

  - id: ddg
    name: DuckDuckGo
    group: intl
    url: "https://duckduckgo.com/html/?q={q}"
    probe: "https://duckduckgo.com/html/?q=python"
    ok_marker: "result__body"
    status_proxy: ok
    status_cn_direct: timeout
    fallback: brave
    intents: [default_en, tech]
    langs: [en, zh, de]
    notes: "大陆直连被屏蔽（GreatFire 确认）；Bangs 快捷 !gh/!so/!w 见手册 ⑤；脚本高频易触发限流"

  - id: yahoo
    name: Yahoo
    group: intl
    url: "https://search.yahoo.com/search?p={q}"
    probe: "https://search.yahoo.com/search?p=python"
