    status_proxy: ok
    status_cn_direct: timeout
    fallback: ddg
    intents: [default_en]
    langs: [en, ja, zh]
    notes: ""

  - id: startpage
    name: Startpage
    group: intl
    url: "https://www.startpage.com/sp/search?query={q}"
    probe: "https://www.startpage.com/sp/search?query=python"
    ok_marker: "result"
    status_proxy: ok
    status_cn_direct: timeout
    fallback: ddg
    intents: [default_en]
    langs: [en, de, zh]
